# Release des Go-Backends (trading-intelligence) als Homebrew-Formula.
# Ausgelöst von .github/workflows/release.yml, nachdem semantic-release Tag + Release angelegt hat.
version: 2
project_name: trading-intelligence

builds:
  - id: trading-intelligence
    dir: backend
    main: ./cmd/trading-intelligence
    binary: trading-intelligence
    env:
      - CGO_ENABLED=0 # SQLite via modernc: reines Go, Cross-Compile ohne macOS-Runner
    goos: [darwin]
    goarch: [arm64, amd64]
    flags: [-trimpath]
    ldflags: ["-s -w"]

archives:
  - formats: [tar.gz]
    name_template: "trading-intelligence_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

# Release und Changelog legt semantic-release an; GoReleaser hängt nur die Assets an.
release:
  mode: keep-existing

changelog:
  disable: true

brews:
  - name: trading-intelligence
    repository:
      owner: monkey-trader
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/monkey-trader/trading-intelligence-platform
    description: Trading-Journal-Backend mit automatischem BingX-Import (lokale HTTP-API)
    directory: Formula
    commit_author:
      name: c3smonkey
      email: marzelwidmer@gmail.com
    # Der Dienst liest die BingX-Keys aus ~/.config/tip/env (BX_KEY=..., BX_SECRET=...),
    # damit keine Secrets in der plist stehen.
    extra_install: |
      (bin/"trading-intelligence-service").write <<~SH
        #!/bin/sh
        ENV_FILE="${HOME}/.config/tip/env"
        if [ -f "$ENV_FILE" ]; then set -a; . "$ENV_FILE"; set +a; fi
        exec "#{opt_bin}/trading-intelligence"
      SH
      chmod 0755, bin/"trading-intelligence-service"
    service: |
      run [opt_bin/"trading-intelligence-service"]
      keep_alive true
      log_path var/"log/trading-intelligence.log"
      error_log_path var/"log/trading-intelligence.log"
    caveats: |
      Keys (nur Lese-Rechte) hinterlegen, dann starten:
        mkdir -p ~/.config/tip && chmod 700 ~/.config/tip
        printf 'BX_KEY=...\nBX_SECRET=...\n' > ~/.config/tip/env && chmod 600 ~/.config/tip/env
        brew services start trading-intelligence
      API: http://127.0.0.1:3000/health
    test: |
      assert_predicate bin/"trading-intelligence", :exist?
