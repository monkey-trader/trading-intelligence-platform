name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web-Client (Lint + Tests + Build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: clients/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: API-Typen erzeugen und Drift prüfen
        run: |
          npm run generate:api
          # Schlägt fehl, wenn die generierten Typen nicht zur Spec passen (auch bei neuen Dateien).
          test -z "$(git status --porcelain -- src/infrastructure/api/)" || {
            git status --porcelain -- src/infrastructure/api/
            git diff -- src/infrastructure/api/
            exit 1
          }

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Formatierung prüfen
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

  backend:
    name: Go-Backend (Format + Vet + Lint + Tests + Build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          # Kein go.sum (nur Standardbibliothek): Cache-Schlüssel aus go.mod.
          cache-dependency-path: backend/go.mod

      - name: Formatierung prüfen
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            echo "Nicht mit gofmt formatiert:"
            echo "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: backend

      - name: Tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

  desktop:
    name: Desktop-App (Format + Vet + Lint + Tests + Build)
    # Wails braucht WebKit/Cocoa, daher macOS-Runner.
    runs-on: macos-15
    defaults:
      run:
        working-directory: clients/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: clients/desktop/go.mod
          cache-dependency-path: clients/desktop/go.sum

      - name: Formatierung prüfen
        run: |
          unformatted="$(gofmt -l .)"
          test -z "$unformatted" || {
            echo "Nicht mit gofmt formatiert:"
            echo "$unformatted"
            exit 1
          }

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0
          working-directory: clients/desktop

      - name: Tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

  contract:
    name: Vertragstest
    runs-on: ubuntu-24.04
    env:
      SERVER_LOG: ${{ github.workspace }}/backend-server.log
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: contracts/package-lock.json

      - name: OpenAPI-Spezifikation prüfen
        run: npx --yes @redocly/cli@2.64.1 lint docs/openapi.yaml

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Go-Backend bauen
        working-directory: backend
        run: go build -o trading-intelligence ./cmd/trading-intelligence

      - name: Backend ohne BingX-Keys starten
        env:
          PORT: '3000'
          HOST: 127.0.0.1
          # Explizit leer: GET /positions/open muss 503 not-configured liefern.
          BX_KEY: ''
          BX_SECRET: ''
        run: |
          (cd backend && nohup ./trading-intelligence > "$SERVER_LOG" 2>&1 &)
          for attempt in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/health > /dev/null; then
              echo "Backend läuft nach ${attempt} Versuch(en)."
              exit 0
            fi
            sleep 1
          done
          echo "Backend hat /health nicht innerhalb von 30 s beantwortet."
          cat "$SERVER_LOG"
          exit 1

      - name: Vertragstest-Abhängigkeiten installieren
        working-directory: contracts
        run: npm ci

      - name: Lint
        working-directory: contracts
        run: npm run lint

      - name: Typecheck
        working-directory: contracts
        run: npm run typecheck

      - name: Formatierung prüfen
        working-directory: contracts
        run: npm run format:check

      - name: Vertragstest
        working-directory: contracts
        env:
          CONTRACT_BASE_URL: http://127.0.0.1:3000
        run: npm test

      - name: Server-Log ausgeben
        if: failure()
        run: cat "$SERVER_LOG" || true
