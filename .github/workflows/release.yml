name: Release

# Push auf main: Version aus Conventional Commits berechnen (feat → minor, fix/perf/chore/docs/refactor/test/ci/style → patch,
# Breaking (`!` / BREAKING CHANGE, jeder Typ) → major), Tag + GitHub Release anlegen, danach bauen und Formula veröffentlichen.
# Tags vom GITHUB_TOKEN lösen keine weiteren Workflows aus, darum läuft der Build im selben Workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.goreleaser.yaml', '.releaserc.json', '.github/workflows/release.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehenden Tag erneut bauen (z.B. v0.1.3), wenn der Build-Job fehlschlug'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version berechnen und Release anlegen
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: semrel
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: tip-server bauen und Homebrew-Formula veröffentlichen
    needs: version
    # PR: nur Snapshot-Check. Push: nur wenn ein Release entstand. Dispatch: gewählter Tag.
    if: >-
      always() && needs.version.result != 'failure' && needs.version.result != 'cancelled' &&
      (github.event_name != 'push' || needs.version.outputs.published == 'true')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      # Web-UI bauen und einbetten; im Release liegt die API im Root, daher leere API-Basis.
      - name: Web-UI bauen
        working-directory: clients/web
        env:
          VITE_API_BASE: ''
        run: npm ci && npm run build

      - name: Web-UI nach webui/dist kopieren
        run: cp -R clients/web/dist/. backend-go/internal/presentation/webui/dist/

      # Ohne index.html entstünde still ein Release mit leerem UI; "/api/" im Bundle hieße, VITE_API_BASE griff nicht.
      - name: UI-Einbettung prüfen
        run: |
          test -f backend-go/internal/presentation/webui/dist/index.html
          ! grep -rq '/api/' backend-go/internal/presentation/webui/dist/assets

      # Mit Tag: Assets ans bestehende Release hängen + Formula im Tap. Auf PRs nur Snapshot bauen.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: ${{ env.RELEASE_TAG != '' && 'release --clean' || 'release --snapshot --skip=publish --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT mit Contents: write auf monkey-trader/homebrew-tap
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
