name: Release

# Push auf main: Version aus Conventional Commits berechnen (feat → minor, fix/perf/chore/docs/refactor/test/ci/style → patch,
# Breaking (`!` / BREAKING CHANGE, jeder Typ) → major), Tag + GitHub Release anlegen, danach bauen und Formula (tip-server) sowie Cask (tip-app) veröffentlichen.
# Tags vom GITHUB_TOKEN lösen keine weiteren Workflows aus, darum läuft der Build im selben Workflow.
on:
  push:
    branches: [main]
  pull_request:
    paths: ['.goreleaser.yaml', '.releaserc.json', '.github/workflows/release.yml', '.github/scripts/render-cask.sh', 'clients/desktop/**']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Bestehenden Tag erneut bauen (z.B. v0.1.3), wenn der Build-Job fehlschlug'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Version berechnen und Release anlegen
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.semrel.outputs.new_release_git_tag }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # semantic-release direkt per npx statt über die Action (die läuft noch auf Node 20).
      - name: semantic-release
        run: >-
          npx --yes
          -p semantic-release@25
          -p conventional-changelog-conventionalcommits@8
          semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # semantic-release setzt den Tag auf HEAD, nur wenn ein Release entstand.
      - id: semrel
        run: |
          git fetch --tags --force
          tag="$(git tag --points-at HEAD --list 'v*' | head -n1)"
          echo "new_release_git_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "new_release_published=$([ -n "$tag" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    name: tip-server bauen und Homebrew-Formula veröffentlichen
    needs: version
    # PR: nur Snapshot-Check. Push: nur wenn ein Release entstand. Dispatch: gewählter Tag.
    if: >-
      always() && needs.version.result != 'failure' && needs.version.result != 'cancelled' &&
      (github.event_name != 'push' || needs.version.outputs.published == 'true')
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: clients/web/package-lock.json

      # Web-UI bauen und einbetten; im Release liegt die API im Root, daher leere API-Basis.
      - name: Web-UI bauen
        working-directory: clients/web
        env:
          VITE_API_BASE: ''
        run: npm ci && npm run build

      - name: Web-UI nach webui/dist kopieren
        run: cp -R clients/web/dist/. backend/internal/presentation/webui/dist/

      # Ohne index.html entstünde still ein Release mit leerem UI; "/api/" im Bundle hieße, VITE_API_BASE griff nicht.
      - name: UI-Einbettung prüfen
        run: |
          test -f backend/internal/presentation/webui/dist/index.html
          ! grep -rq '/api/' backend/internal/presentation/webui/dist/assets

      # Mit Tag: Assets ans bestehende Release hängen + Formula im Tap. Auf PRs nur Snapshot bauen.
      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: '~> v2'
          args: ${{ env.RELEASE_TAG != '' && 'release --clean' || 'release --snapshot --skip=publish --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Fine-grained PAT mit Contents: write auf monkey-trader/homebrew-tap
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}

  desktop:
    name: tip-app bauen und Homebrew-Cask veröffentlichen
    needs: version
    # Gleiche Bedingung wie der Server-Release; auf PRs wird nur gebaut und gezippt.
    if: >-
      always() && needs.version.result != 'failure' && needs.version.result != 'cancelled' &&
      (github.event_name != 'push' || needs.version.outputs.published == 'true')
    runs-on: macos-15
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || needs.version.outputs.tag }}
      WAILS_VERSION: v2.17.0 # wie in clients/desktop/go.mod
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG || github.ref }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: clients/desktop/go.mod
          cache-dependency-path: clients/desktop/go.sum

      - name: Wails installieren
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${WAILS_VERSION}

      # Das UI liefert der tip-server aus; die App bringt nur das Fenster mit (kein Frontend-Build).
      - name: App bauen (Intel + Apple Silicon)
        working-directory: clients/desktop
        run: wails build -skipbindings -s -platform darwin/universal

      - name: ZIP erzeugen
        working-directory: clients/desktop/build/bin
        run: |
          version="${RELEASE_TAG#v}"
          ditto -c -k --keepParent "Trading Intelligence Platform.app" "tip-app_${version:-snapshot}_darwin_universal.zip"
          ls -l *.zip

      - name: ZIP ans GitHub-Release hängen
        if: env.RELEASE_TAG != ''
        working-directory: clients/desktop/build/bin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" tip-app_*_darwin_universal.zip --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Cask im Tap aktualisieren
        if: env.RELEASE_TAG != ''
        env:
          # Fine-grained PAT mit Contents: write auf monkey-trader/homebrew-tap (wie für die Formula)
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          version="${RELEASE_TAG#v}"
          sha256="$(shasum -a 256 clients/desktop/build/bin/tip-app_${version}_darwin_universal.zip | cut -d' ' -f1)"
          git clone --depth 1 "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/monkey-trader/homebrew-tap.git" tap
          mkdir -p tap/Casks
          .github/scripts/render-cask.sh "${version}" "${sha256}" > tap/Casks/tip-app.rb
          cd tap
          git config user.name "c3smonkey"
          git config user.email "marzelwidmer@gmail.com"
          git add Casks/tip-app.rb
          git diff --cached --quiet && { echo "Cask unverändert."; exit 0; }
          git commit -m "Cask tip-app ${version}"
          git push
