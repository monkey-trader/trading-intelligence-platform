<!doctype html>
<html lang="de-CH">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Trading Intelligence Platform</title>
    <script>
      // Gespeicherte Design-Wahl vor dem ersten Rendern setzen (kein Aufblitzen der falschen Farben).
      try {
        var theme = localStorage.getItem('tip_theme_v1');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
