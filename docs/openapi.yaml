openapi: 3.1.0
info:
  title: Trading Intelligence Platform API
  version: 0.5.0
  description: |-
    HTTP/JSON-API des Backends. Diese Spezifikation ist der Vertrag zwischen Backend
    und Clients: erst hier anpassen, dann implementieren. Jedes Backend (TypeScript, später Go)
    muss den Vertragstest in `contracts/` bestehen.

    Hinweis: Das Go-Backend liefert zusätzlich das Web-UI unter `/` aus (eingebettet, SPA-Fallback).
    Das ist kein Teil des API-Vertrags; `/health`, `/positions` und `/api` bleiben immer API.

    Allgemeine Regeln, die für alle Pfade gelten:
    - Die Host-Prüfung läuft vor dem Routing: Ein nicht erlaubter Host-Header ergibt immer
      403 `forbidden-host`, auch für unbekannte oder ungültige Pfade. Erlaubt sind mindestens
      `127.0.0.1:<port>`, `localhost:<port>` und `[::1]:<port>` sowie ausdrücklich konfigurierte
      Hosts; der Vergleich ignoriert Groß-/Kleinschreibung.
    - Unbekannte Pfade und nicht beschriebene Methoden (auch `HEAD`, `OPTIONS`; `PUT` und `DELETE`
      nur auf `/positions/{positionId}/initial-stop-loss` beschrieben) ergeben 404 `not-found`,
      unabhängig von einem mitgeschickten Body.
    - Schreibende Routen (`PUT`/`DELETE`) gibt es nur auf Loopback; mit `ALLOW_REMOTE=true` werden sie
      nicht registriert (404). Sie verlangen `Content-Type: application/json` (sonst 415
      `unsupported-media-type`), prüfen einen mitgeschickten `Origin` gegen die erlaubten Hosts
      (sonst 403 `forbidden-origin`) und begrenzen den Body auf 1 KiB.
    - Formal fehlerhafte Anfragen (z.B. ungültige Prozent-Kodierung im Pfad) ergeben
      400 `bad-request`.
    - Alle Fehler kommen als `application/problem+json` (Schema `Problem`) ohne interne Details;
      unerwartete Fehler als 500 `internal`.
    - Der Header `Retry-After` kommt nur bei 503 `rate-limited`.
  license:
    name: Proprietär
    identifier: LicenseRef-Proprietary
servers:
  - url: http://127.0.0.1:3000
    description: >-
      Lokale Entwicklung. Phase 1 ohne Authentifizierung, daher nur Loopback; Anfragen mit
      einem anderen Host-Header werden mit 403 forbidden-host abgelehnt (Schutz vor DNS-Rebinding).
security: []
paths:
  /health:
    get:
      operationId: getHealth
      summary: Lebenszeichen des Backends
      description: Antwortet mit 200, solange der Server läuft. Gibt keine Konfiguration oder Secrets aus.
      tags:
        - System
      responses:
        '200':
          description: Backend läuft.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
        '403':
          $ref: '#/components/responses/Problem'
  /positions/open:
    get:
      operationId: getOpenPositions
      summary: Aktuell offene Positionen
      description: >-
        Fragt BingX ab, nichts wird gespeichert. Antworten werden bis zu 5 s zwischengespeichert,
        `fetchedAt` nennt das tatsächliche Alter der Daten. Positionen sind nach Eröffnungszeit
        sortiert, neueste zuerst. Leere Liste, wenn keine Position offen ist.
      tags:
        - Positionen
      responses:
        '200':
          description: Offene Positionen mit Summen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenPositionsSnapshot'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /account/summary:
    get:
      operationId: getAccountSummary
      summary: Kontostand und Monats-Performance
      description: >-
        Kontostand (`balance`), Equity und verfügbare Margin kommen live von BingX (bis zu 5 s
        zwischengespeichert). Der Monats-PnL ist die Summe aus `REALIZED_PNL`, `TRADING_FEE` und
        `FUNDING_FEE` der lokalen Income-Tabelle im laufenden Kalendermonat (Europe/Zurich) und
        daher nur so aktuell wie der letzte Import; die Historie ab Monatsanfang wird beim Start einmalig
        nachgeladen. `monthlyPnlPercent` = Monats-PnL ÷ `equity` × 100, auf 2 Nachkommastellen
        (half-up); `null`, wenn `equity` 0 ist. `equity` entspricht dem Kontostand der BingX-Anzeige
        (USD-M Perp). Bezogen auf die aktuelle Equity, nicht aufs Startkapital des Monats; Ein-/Auszahlungen verzerren den Wert.
      tags:
        - Konto
      responses:
        '200':
          description: Kontostand mit Monats-PnL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountSummary'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /positions/{positionId}/chart:
    get:
      operationId: getPositionChart
      summary: Kerzen-Chart einer offenen Position mit Entry, Stop-Loss und Take-Profit
      description: >-
        Liefert die letzten `limit` Kerzen des Symbols (öffentlicher BingX-Klines-Endpunkt, im Backend
        in SQLite zwischengespeichert) sowie Entry, Stop-Loss- und Take-Profit-Linien der Position.
        SL und TP stammen aus den offenen BingX-Orders (`STOP_MARKET`, `TAKE_PROFIT_MARKET`), die über
        die `positionId` zugeordnet werden. Mehrere Teil-TPs und -SLs sind möglich, ohne SL/TP sind die
        Listen leer. Nur lesend. Orders werden bis zu 5 s zwischengespeichert, `fetchedAt` nennt das
        Alter. Stufe 1 gilt nur für aktuell offene Positionen; unbekannte oder geschlossene `positionId`
        liefert 404.
      tags:
        - Positionen
      parameters:
        - name: positionId
          in: path
          required: true
          description: BingX-Positions-ID (19-stellig, immer String).
          schema:
            type: string
            pattern: '^\d{1,20}$'
        - name: interval
          in: query
          required: false
          description: Kerzenintervall.
          schema:
            type: string
            enum:
              - 5m
              - 15m
              - 1h
              - 4h
              - 1d
            default: 15m
        - name: limit
          in: query
          required: false
          description: Anzahl der letzten Kerzen (BingX erlaubt höchstens 1000 pro Abfrage).
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 300
      responses:
        '200':
          description: Chart-Daten der Position.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PositionChart'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
  /positions/{positionId}/initial-stop-loss:
    put:
      operationId: setInitialStopLoss
      summary: Ursprünglichen Stop-Loss einer offenen Position manuell setzen
      description: >-
        BingX überschreibt einen nachgezogenen SL in derselben Order; der Ursprungswert steht danach in
        keiner Order-Historie. Mit diesem Endpunkt trägt der Nutzer ihn von Hand ein. Der Wert wird
        zusammen mit dem aktuellen Entry der Position gespeichert (damit die R-Level bei Nachkäufen nicht
        wandern) und hat Vorrang vor dem automatisch ermittelten Risiko. Danach liefern
        `GET /positions/open` und der Chart `levels`, `riskDistance`, `currentRMultiple` und
        `breakEvenTriggerReached` mit `initialStopLossSource: MANUAL`. Ein erneutes `PUT` ersetzt den
        Wert. Der SL muss auf der Verlustseite des Entry liegen (LONG darunter, SHORT darüber).
        Nur für aktuell offene Positionen. Schreibt nur in die eigene Datenbank, nie zu BingX.
      tags:
        - Positionen
      parameters:
        - name: positionId
          in: path
          required: true
          description: BingX-Positions-ID (19-stellig, immer String).
          schema:
            type: string
            pattern: '^\d{1,20}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetInitialStopLossRequest'
      responses:
        '200':
          description: Der gespeicherte manuelle Ursprungs-SL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitialStopLoss'
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '502':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        '504':
          $ref: '#/components/responses/Problem'
    delete:
      operationId: clearInitialStopLoss
      summary: Manuellen Ursprungs-SL entfernen
      description: >-
        Entfernt den manuell gesetzten Wert; die Position fällt auf das automatisch ermittelte Risiko
        zurück (`initialStopLossSource: AUTO`, bzw. unbekannt, wenn es keins gibt). Die Antwort ist
        immer 204 (idempotent), auch ohne vorhandenen manuellen Wert und für unbekannte oder
        geschlossene Positionen.
      tags:
        - Positionen
      parameters:
        - name: positionId
          in: path
          required: true
          description: BingX-Positions-ID (19-stellig, immer String).
          schema:
            type: string
            pattern: '^\d{1,20}$'
      responses:
        '204':
          description: Der manuelle Wert ist entfernt (oder war nicht vorhanden).
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
  /assets/icons:
    get:
      operationId: getAssetIcons
      summary: Coin-Icons für BingX-Symbole
      description: >-
        Löst die Basis-Assets der angefragten Symbole über CoinGecko (`coins/markets`, ein Abruf für
        alle Symbole) in Icon-URLs auf. Bei mehreren Coins mit demselben Symbol gewinnt der mit dem
        besten Marktkapitalisierungs-Rang. Treffer werden 24 h zwischengespeichert, fehlende 10 min.
        Metalle (XAU, XAG) und nicht auflösbare Symbole liefern `iconUrl: null`. Ist CoinGecko nicht
        erreichbar oder drosselt es, antwortet die API trotzdem mit 200 und `iconUrl: null` (kein
        Icon ist kein Fehler). Es werden nur HTTPS-URLs von `coin-images.coingecko.com` ausgeliefert.
      tags:
        - Assets
      parameters:
        - name: symbols
          in: query
          required: true
          description: >-
            Kommaseparierte BingX-Symbole, z.B. `BTC-USDT,SUI-USDT` (1 bis 50, Duplikate werden
            entfernt, nur Großbuchstaben, Ziffern und "-"). Sonst 400.
          schema:
            type: string
            pattern: '^[A-Z0-9]{1,20}(-[A-Z0-9]+)*(,[A-Z0-9]{1,20}(-[A-Z0-9]+)*)*$'
          example: BTC-USDT,SUI-USDT
      responses:
        '200':
          description: Icons je Symbol.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetIcons'
              example:
                icons:
                  - symbol: SUI-USDT
                    baseAsset: SUI
                    displayName: SUI
                    iconUrl: https://coin-images.coingecko.com/coins/images/26375/large/sui-ocean-square.png
                  - symbol: NCCOGOLD2USD-USDT
                    baseAsset: XAU
                    displayName: Gold
                    iconUrl: null
        '400':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '500':
          $ref: '#/components/responses/Problem'
tags:
  - name: System
    description: Betriebliche Endpunkte
  - name: Positionen
    description: Positionen des BingX-Futures-Kontos
  - name: Assets
    description: Zusatzdaten zu Assets (Icons)
components:
  responses:
    Problem:
      description: >-
        Fehlerantwort ohne interne Details: 400 bad-request, 403 forbidden-host/forbidden-origin,
        404 not-found, 413 payload-too-large, 415 unsupported-media-type, 422 invalid-stop-loss,
        502 upstream-error/invalid-response, 503 not-configured/rate-limited, 504 unreachable,
        500 internal.
      headers:
        Retry-After:
          description: Sekunden bis zum nächsten Versuch, nur bei rate-limited (503).
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Decimal:
      type: string
      pattern: '^-?\d+(\.\d+)?$'
      description: Dezimalzahl als String, verlustfrei wie von BingX geliefert.
      example: '0.9634'
    Problem:
      type: object
      additionalProperties: false
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          enum:
            - bad-request
            - forbidden-host
            - forbidden-origin
            - not-found
            - payload-too-large
            - unsupported-media-type
            - invalid-stop-loss
            - not-configured
            - rate-limited
            - unreachable
            - upstream-error
            - invalid-response
            - internal
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    SetInitialStopLossRequest:
      type: object
      additionalProperties: false
      required:
        - initialStopLoss
      properties:
        initialStopLoss:
          $ref: '#/components/schemas/Decimal'
          description: >-
            Ursprünglicher SL-Trigger. Muss auf der Verlustseite des aktuellen Entry liegen
            (LONG kleiner, SHORT größer); sonst 422 `invalid-stop-loss`.
    InitialStopLoss:
      type: object
      additionalProperties: false
      required:
        - positionId
        - initialStopLoss
        - entryPrice
        - riskDistance
        - source
        - setAt
      properties:
        positionId:
          type: string
        initialStopLoss:
          $ref: '#/components/schemas/Decimal'
        entryPrice:
          $ref: '#/components/schemas/Decimal'
          description: Entry der Position zum Zeitpunkt der Eingabe (Basis der R-Level).
        riskDistance:
          $ref: '#/components/schemas/Decimal'
          description: Risiko-Distanz |entryPrice - initialStopLoss| (1R).
        source:
          type: string
          enum:
            - MANUAL
        setAt:
          type: integer
          description: Zeitpunkt der Eingabe in Epoch-Millisekunden.
    AccountSummary:
      type: object
      required: [balance, equity, availableMargin, month, monthlyRealizedPnl, monthlyPnlPercent, periods, unrealizedPnl, unrealizedPnlPercent]
      properties:
        balance:
          $ref: '#/components/schemas/Decimal'
        equity:
          $ref: '#/components/schemas/Decimal'
        availableMargin:
          $ref: '#/components/schemas/Decimal'
        month:
          type: string
          pattern: '^\d{4}-(0[1-9]|1[0-2])$'
          description: Kalendermonat (Europe/Zurich), auf den sich der Monats-PnL bezieht.
          example: '2026-10'
        monthlyRealizedPnl:
          $ref: '#/components/schemas/Decimal'
        monthlyPnlPercent:
          description: Monats-PnL in Prozent der Equity; `null` bei Equity 0.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        periods:
          type: array
          description: >-
            Netto-PnL (REALIZED_PNL + TRADING_FEE + FUNDING_FEE) für Heute, 7T und 30T in dieser Reihenfolge.
            `today` beginnt um 00:00 Europe/Zurich, `7d`/`30d` sind gleitende Fenster bis jetzt.
          items:
            $ref: '#/components/schemas/PeriodPnl'
        unrealizedPnl:
          $ref: '#/components/schemas/Decimal'
        unrealizedPnlPercent:
          description: Unrealisierter PnL des Kontos in Prozent der `equity`; `null` bei Equity <= 0 oder unbekanntem Wert.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
    PeriodPnl:
      type: object
      required: [period, realizedPnl, pnlPercent]
      properties:
        period:
          type: string
          enum: [today, 7d, 30d]
        realizedPnl:
          $ref: '#/components/schemas/Decimal'
        pnlPercent:
          description: >-
            PnL in Prozent der Equity am Periodenanfang (Equity jetzt minus PnL, Ein-/Auszahlungen
            werden nicht berücksichtigt); `null`, wenn diese Basis 0 oder negativ ist.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
    OpenPositionsSnapshot:
      type: object
      additionalProperties: false
      required:
        - positions
        - totalUnrealizedProfit
        - fetchedAt
      properties:
        positions:
          type: array
          items:
            $ref: '#/components/schemas/OpenPosition'
        totalUnrealizedProfit:
          $ref: '#/components/schemas/Decimal'
          description: Summe des unrealisierten PnL aller offenen Positionen (exakt, "0" wenn keine).
        fetchedAt:
          type: integer
          description: Zeitpunkt der Abfrage bei BingX in Epoch-Millisekunden.
    OpenPosition:
      type: object
      additionalProperties: false
      required:
        - positionId
        - symbol
        - side
        - isolated
        - positionAmount
        - avgOpenPrice
        - markPrice
        - leverage
        - initialMargin
        - margin
        - positionValue
        - unrealizedProfit
        - realisedProfit
        - pnlRatio
        - openTime
        - updateTime
        - stopLoss
        - takeProfit
        - breakEven
      properties:
        positionId:
          type: string
          description: BingX-Positions-ID (19-stellig, immer String).
        symbol:
          type: string
          example: SUI-USDT
        side:
          type: string
          enum:
            - LONG
            - SHORT
        isolated:
          type: boolean
        positionAmount:
          $ref: '#/components/schemas/Decimal'
        avgOpenPrice:
          $ref: '#/components/schemas/Decimal'
        markPrice:
          $ref: '#/components/schemas/Decimal'
        leverage:
          type: number
          exclusiveMinimum: 0
        initialMargin:
          $ref: '#/components/schemas/Decimal'
        margin:
          $ref: '#/components/schemas/Decimal'
        positionValue:
          $ref: '#/components/schemas/Decimal'
        unrealizedProfit:
          $ref: '#/components/schemas/Decimal'
        realisedProfit:
          $ref: '#/components/schemas/Decimal'
          description: Bereits realisierter PnL aus Teilschlüssen und Gebühren.
        pnlRatio:
          $ref: '#/components/schemas/Decimal'
          description: Unrealisierter PnL relativ zur Margin (0.25 = 25 %).
        openTime:
          type: integer
          description: Eröffnung in Epoch-Millisekunden.
        updateTime:
          type: integer
          description: Letzte Änderung in Epoch-Millisekunden.
        stopLoss:
          description: >-
            Trigger-Preis des offenen Stop-Loss der Position (pro Trade gibt es einen; lieferte BingX
            dennoch mehrere, gilt defensiv der engste: LONG der höchste, SHORT der niedrigste). null ohne SL oder wenn die Orders nicht geladen werden konnten.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        takeProfit:
          description: >-
            Trigger-Preis des nächsten offenen Take-Profit (dem Entry am nächsten). null ohne TP oder
            wenn die Orders nicht geladen werden konnten.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        breakEven:
          description: >-
            true, wenn ein SL existiert und der SL nicht im Verlust liegt (LONG SL >= Entry,
            SHORT SL <= Entry). false bei SL im Verlust oder ohne SL. null, wenn die offenen Orders
            nicht geladen werden konnten (die Liste wird trotzdem geliefert).
          oneOf:
            - type: boolean
            - type: 'null'
        initialStopLoss:
          description: >-
            Ursprünglicher SL (beim ersten Sehen der Position gespeichert, wird nie überschrieben).
            null, wenn die Position beim ersten Sehen schon auf Break-even stand oder kein SL existierte.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        initialStopLossSource:
          description: >-
            Herkunft von `initialStopLoss`: MANUAL (per PUT eingetragen) oder AUTO (beim ersten Sehen
            oder aus der Order-Historie ermittelt). null, wenn das Risiko unbekannt ist.
          oneOf:
            - type: string
              enum:
                - AUTO
                - MANUAL
            - type: 'null'
        riskDistance:
          description: Risiko-Distanz |Entry - initialStopLoss| (1R in Preiseinheiten). null, wenn unbekannt.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        currentRMultiple:
          description: >-
            Aktueller Gewinn in R ((Mark Price - Entry) / riskDistance, SHORT gespiegelt), negativ im Verlust.
            null, wenn das Risiko unbekannt ist.
          oneOf:
            - $ref: '#/components/schemas/Decimal'
            - type: 'null'
        breakEvenTriggerReached:
          description: >-
            true, sobald der Kurs seit Eröffnung 2R erreicht hat (Hoch/Tief der Kerzen; bleibt true).
            Nicht zu verwechseln mit `breakEven` (SL aktuell nicht im Verlust). null, wenn unbekannt.
          oneOf:
            - type: boolean
            - type: 'null'
        reached2RAt:
          description: Kerzenbeginn (Epoch-Millisekunden), in dem 2R erstmals erreicht wurde. null, wenn nicht erreicht oder unbekannt.
          oneOf:
            - type: integer
            - type: 'null'
        levels:
          type: array
          description: >-
            CRV-Level 1R/2R/3R als Preise (2R = Preis, an dem der SL auf Break-even gezogen wird, 3R = Ziel).
            Fehlt, wenn das Risiko unbekannt ist.
          items:
            $ref: '#/components/schemas/RLevel'
    RLevel:
      type: object
      additionalProperties: false
      required:
        - kind
        - rMultiple
        - price
        - percent
      properties:
        kind:
          type: string
          enum:
            - ONE_R
            - TWO_R
            - THREE_R
          description: TWO_R ist der Break-even-Trigger, THREE_R das CRV-Ziel.
        rMultiple:
          type: integer
          description: 1, 2 oder 3.
        price:
          $ref: '#/components/schemas/Decimal'
        percent:
          $ref: '#/components/schemas/Decimal'
          description: Abstand des Levels zum Entry relativ zum Entry (0.03 = 3 %).
    PositionChart:
      type: object
      additionalProperties: false
      required:
        - positionId
        - symbol
        - side
        - interval
        - candles
        - entry
        - stopLoss
        - takeProfit
        - markers
        - fetchedAt
      properties:
        positionId:
          type: string
        symbol:
          type: string
          example: SUI-USDT
        side:
          type: string
          enum:
            - LONG
            - SHORT
        interval:
          type: string
          enum:
            - 5m
            - 15m
            - 1h
            - 4h
            - 1d
        candles:
          type: array
          description: Aufsteigend nach `time` sortiert (BingX liefert absteigend), ohne Duplikate.
          items:
            $ref: '#/components/schemas/Candle'
        entry:
          $ref: '#/components/schemas/EntryLevel'
        stopLoss:
          type: array
          description: Offene Stop-Loss-Orders der Position, leer wenn keine gesetzt ist.
          items:
            $ref: '#/components/schemas/ProtectiveOrder'
        takeProfit:
          type: array
          description: Offene Take-Profit-Orders der Position (Teil-TPs einzeln), leer wenn keine gesetzt ist.
          items:
            $ref: '#/components/schemas/ProtectiveOrder'
        markers:
          type: array
          description: Ereignisse auf der Zeitachse. In Stufe 1 nur der Einstieg.
          items:
            $ref: '#/components/schemas/ChartMarker'
        levels:
          type: array
          description: >-
            CRV-Level 1R/2R/3R aus dem ursprünglichen Risiko (Entry bis initialStopLoss). Leer, wenn das
            Risiko unbekannt ist.
          items:
            $ref: '#/components/schemas/RLevel'
        fetchedAt:
          type: integer
          description: Zeitpunkt der Abfrage der Orders bei BingX in Epoch-Millisekunden.
    Candle:
      type: object
      additionalProperties: false
      required:
        - time
        - open
        - high
        - low
        - close
        - volume
      properties:
        time:
          type: integer
          description: Beginn der Kerze in Epoch-Millisekunden.
        open:
          $ref: '#/components/schemas/Decimal'
        high:
          $ref: '#/components/schemas/Decimal'
        low:
          $ref: '#/components/schemas/Decimal'
        close:
          $ref: '#/components/schemas/Decimal'
        volume:
          $ref: '#/components/schemas/Decimal'
    EntryLevel:
      type: object
      additionalProperties: false
      required:
        - price
        - time
      properties:
        price:
          $ref: '#/components/schemas/Decimal'
          description: Durchschnittlicher Einstiegspreis der Position.
        time:
          type: integer
          description: Eröffnung der Position in Epoch-Millisekunden.
    ProtectiveOrder:
      type: object
      additionalProperties: false
      required:
        - orderId
        - triggerPrice
        - quantity
        - distanceRatio
      properties:
        orderId:
          type: string
          description: BingX-Order-ID (19-stellig, immer String, nie als Zahl parsen).
        triggerPrice:
          $ref: '#/components/schemas/Decimal'
          description: Auslösepreis (`stopPrice` bei BingX).
        quantity:
          $ref: '#/components/schemas/Decimal'
        distanceRatio:
          $ref: '#/components/schemas/Decimal'
          description: >-
            Abstand des Auslösepreises zum Entry relativ zum Entry, 8 Nachkommastellen, vorzeichenbehaftet
            (-0.075 = 7.5 % unter dem Entry, +0.25 = 25 % darüber).
    ChartMarker:
      type: object
      additionalProperties: false
      required:
        - time
        - kind
        - price
      properties:
        time:
          type: integer
          description: Zeitpunkt in Epoch-Millisekunden.
        kind:
          type: string
          enum:
            - ENTRY
        price:
          $ref: '#/components/schemas/Decimal'
    AssetIcons:
      type: object
      additionalProperties: false
      required:
        - icons
      properties:
        icons:
          type: array
          description: Ein Eintrag je angefragtem Symbol, in der Reihenfolge der Anfrage, ohne Duplikate.
          items:
            $ref: '#/components/schemas/AssetIcon'
    AssetIcon:
      type: object
      additionalProperties: false
      required:
        - symbol
        - baseAsset
        - displayName
        - iconUrl
      properties:
        symbol:
          type: string
          description: Das angefragte BingX-Symbol, unverändert.
          example: SUI-USDT
        baseAsset:
          type: string
          description: >-
            Basis-Asset in Großbuchstaben (Teil vor dem ersten "-"). Rohstoff-Kontrakte nach dem
            Muster `NCCO<Name>2USD` werden auf den Rohstoff-Code normalisiert: `NCCOGOLD2USD` wird
            `XAU`, `NCCOXAG2USD` bleibt `XAG`, `NCCONICKEL2USD` wird `NICKEL`.
          example: SUI
        displayName:
          type: string
          description: >-
            Anzeigename ohne Quote (kein "-USDT"). Coins: der Ticker in Großbuchstaben (`ONDO`).
            Rohstoffe: deutscher Name (`XAU` Gold, `XAG` Silber, sonst der Rohstoff-Name mit großem
            Anfangsbuchstaben, z.B. `Nickel`).
          example: SUI
        iconUrl:
          type:
            - string
            - 'null'
          format: uri
          description: >-
            HTTPS-URL des Icons (nur Host `coin-images.coingecko.com`), `null` wenn kein Icon bekannt
            ist, die Quelle nicht erreichbar war oder das Asset ein Rohstoff ist (Muster `NCCO<Name>2USD`,
            XAU, XAG). Für Gold und Silber zeigt der Client lokale Icons.
          example: https://coin-images.coingecko.com/coins/images/26375/large/sui-ocean-square.png
